<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="A Formula 1 car with code symbols racing past a checkered flag under a sign reading while lap less than 19">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b6b63"/><stop offset="1" stop-color="#064b4a"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a7d"/><stop offset="1" stop-color="#ff5a36"/></linearGradient>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#10211f"/><rect x="8" y="8" width="8" height="8" fill="#10211f"/></pattern>
  </defs>
  <rect width="640" height="230" rx="14" fill="url(#sky)"/>
  <!-- gantry sign with code -->
  <rect x="150" y="14" width="340" height="40" rx="8" fill="#10211f" stroke="#ff7a59" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#7ff0d8">while lap &lt; 19: drive()</text>
  <rect x="196" y="0" width="4" height="14" fill="#cdeee8"/><rect x="440" y="0" width="4" height="14" fill="#cdeee8"/>
  <!-- checkered flags -->
  <g transform="translate(540 28)">
    <rect x="0" y="0" width="5" height="120" fill="#e8f3f1"/>
    <path d="M5 4 L78 4 Q70 20 78 36 L5 36 Z" fill="url(#chk)" stroke="#10211f" stroke-width="2"/>
  </g>
  <!-- track -->
  <rect x="0" y="150" width="640" height="62" fill="#1b2c2b"/>
  <rect x="0" y="150" width="640" height="6" fill="#ff7a59"/><rect x="0" y="156" width="640" height="3" fill="#fff"/>
  <g stroke="#e8f3f1" stroke-width="3" stroke-dasharray="26 18"><line x1="0" y1="190" x2="640" y2="190"/></g>
  <!-- start/finish line -->
  <rect x="520" y="159" width="14" height="53" fill="url(#chk)"/>
  <!-- speed lines -->
  <g stroke="#7ff0d8" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="30" y1="112" x2="110" y2="112"/><line x1="10" y1="128" x2="100" y2="128"/><line x1="40" y1="144" x2="104" y2="144"/>
  </g>
  <!-- code particles -->
  <g font-family="monospace" font-size="20" font-weight="700" fill="#cdeee8" opacity=".9">
    <text x="22" y="82">{ }</text><text x="96" y="96">0 1</text><text x="22" y="182" fill="#ffb59f">O(n)</text>
  </g>
  <!-- F1 car, side view -->
  <g transform="translate(150 70)">
    <!-- rear wing -->
    <rect x="6" y="2" width="40" height="8" rx="2" fill="#10211f"/><rect x="22" y="8" width="6" height="30" fill="#10211f"/>
    <!-- body -->
    <path d="M10 62 L10 46 Q40 36 90 34 L150 28 Q168 24 182 28 L262 46 L330 52 Q340 53 340 60 L340 68 L10 68 Z" fill="url(#body)" stroke="#10211f" stroke-width="3" stroke-linejoin="round"/>
    <!-- cockpit and halo -->
    <path d="M150 30 Q170 8 196 14 L212 34 Z" fill="#10211f"/>
    <circle cx="186" cy="26" r="10" fill="#cdeee8"/><circle cx="186" cy="26" r="5" fill="#10211f"/>
    <path d="M168 34 Q190 4 220 34" fill="none" stroke="#10211f" stroke-width="4" stroke-linecap="round"/>
    <!-- engine cover code tag -->
    <rect x="62" y="40" width="64" height="22" rx="5" fill="#10211f"/>
    <text x="94" y="56" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#7ff0d8">&lt;/&gt;</text>
    <!-- number -->
    <text x="238" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#10211f">9569</text>
    <!-- front wing -->
    <path d="M300 74 L352 74 L352 82 L296 82 Z" fill="#10211f"/>
    <rect x="344" y="66" width="8" height="16" rx="2" fill="#ff7a59" stroke="#10211f" stroke-width="2"/>
    <!-- wheels -->
    <g>
      <circle cx="70" cy="76" r="26" fill="#10211f"/><circle cx="70" cy="76" r="14" fill="#cdeee8"/>
      <text x="70" y="81" text-anchor="middle" font-family="monospace" font-size="13" font-weight="800" fill="#10211f">01</text>
      <circle cx="288" cy="78" r="22" fill="#10211f"/><circle cx="288" cy="78" r="12" fill="#cdeee8"/>
      <text x="288" y="83" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#10211f">10</text>
    </g>
  </g>
</svg>
