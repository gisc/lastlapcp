olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  lastlapcp: 1

metadata:
  name: lastlapcp
  title: LastLapCP
  description: Gamified A-level H2 Computing 9569 revision drills for Papers 1 and 2
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.1
  categories:
    - Education

entrances:
  - name: lastlapcp
    host: lastlapcp
    port: 8000
    title: LastLapCP
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    authLevel: public
    openMethod: default

envs:
  - envName: GOOGLE_CLIENT_ID
    required: true
    editable: true
  - envName: GOOGLE_CLIENT_SECRET
    required: true
    type: password
    editable: true
  - envName: SECRET_KEY
    required: true
    type: password
    editable: true
  - envName: ALLOWED_EMAILS
    required: true
    type: password
    editable: true
  - envName: TEACHER_EMAILS
    required: true
    type: password
    editable: true

spec:
  versionName: '0.1.1'
  requiredCpu: 250m
  limitedCpu: 1000m
  requiredMemory: 256Mi
  limitedMemory: 512Mi
  requiredDisk: 512Mi
  supportArch:
    - amd64
    - arm64
  fullDescription: |
    Mobile-first gamified revision for A-level H2 Computing (9569) Papers 1 and 2.
    MCQ and multi-select misconception questions with explanations, XP, streaks and
    per-topic mastery. Google sign-in restricted to a class allowlist. Teacher dashboard
    shows per-student XP, streaks and topic mastery.
  upgradeDescription: |
    Initial release.
  developer: Soong Chee Gi
  website: https://github.com/gisc/lastlapcp
  sourceCode: https://github.com/gisc/lastlapcp
  locale:
    - en-US
permission:
  appData: true

options:
  dependencies:
    - name: olares
      version: ">=1.12.6-0"
      type: system
