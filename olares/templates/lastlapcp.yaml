apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastlapcp
spec:
  replicas: {{ .Values.workloads.lastlapcp.replicaCount }}
  selector:
    matchLabels:
      app: lastlapcp
  template:
    metadata:
      labels:
        app: lastlapcp
    spec:
      containers:
        - name: lastlapcp
          image: ghcr.io/gisc/lastlapcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_CLIENT_ID
              value: "{{ .Values.olaresEnv.GOOGLE_CLIENT_ID }}"
            - name: GOOGLE_CLIENT_SECRET
              value: "{{ .Values.olaresEnv.GOOGLE_CLIENT_SECRET }}"
            - name: SECRET_KEY
              value: "{{ .Values.olaresEnv.SECRET_KEY }}"
            - name: ALLOWED_EMAILS
              value: "{{ .Values.olaresEnv.ALLOWED_EMAILS }}"
            - name: TEACHER_EMAILS
              value: "{{ .Values.olaresEnv.TEACHER_EMAILS }}"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: lastlapcp
spec:
  selector:
    app: lastlapcp
  ports:
    - port: 8000
      targetPort: 8000
