<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<title>{% block title %}LastLapCP{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">LastLap<span>CP</span></a>
  {% if session.get('uid') %}<a class="logout" href="{{ url_for('logout') }}">Log out</a>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<script>
if ('serviceWorker' in navigator) { navigator.register("{{ url_for('static', filename='sw.js') }}").catch(()=>{}); }
</script>
</body>
</html>
